{% extends 'services/base.html' %}

{% block title %}登录 | {{ salon.name }}{% endblock %}

{% block header_content %}
    <h1 class="display-4 fw-bold">欢迎回来</h1>
    <p class="lead">请登录以访问您的个性化仪表盘</p>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">用户名</label>
                        <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">密码</label>
                        <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">进入系统</button>
                    </div>
                </form>
                <div class="mt-4 text-center">
                    <p class="text-muted">还没有账号？ <a href="{% url 'register' %}" class="text-theme-accent fw-bold text-decoration-none">注册一个</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
