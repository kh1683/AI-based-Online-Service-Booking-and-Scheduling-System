{% extends 'services/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0" style="border-radius: 20px;">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="bg-success text-white d-inline-block p-3 rounded-circle mb-3">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold">Verify OTP</h3>
                        <p class="text-muted">Please check your email for the 6-digit code.</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Enter OTP Code</label>
                            <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold" maxlength="6" placeholder="000000" style="letter-spacing: 10px;" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">New Password</label>
                            <input type="password" name="new_password" class="form-control form-control-lg" placeholder="Enter new password" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Confirm New Password</label>
                            <input type="password" id="confirm_password" class="form-control" required>
                            <div id="passwordHelp" class="text-danger small mt-1" style="display:none;">The passwords you entered do not match.</div>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill shadow-sm">
                            Reset Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    // 简单的 JavaScript 逻辑：如果两次密码不一致，禁用提交按钮
    const password = document.getElementById("new_password");
    const confirm = document.getElementById("confirm_password");
    const helpText = document.getElementById("passwordHelp");
    const submitBtn = document.querySelector("button[type='submit']");

    function validate() {
        if (password.value !== confirm.value) {
            helpText.style.display = "block";
            submitBtn.disabled = true;
        } else {
            helpText.style.display = "none";
            submitBtn.disabled = false;
        }
    }
    confirm.addEventListener('keyup', validate);
    password.addEventListener('keyup', validate);
</script>
{% endblock %}
