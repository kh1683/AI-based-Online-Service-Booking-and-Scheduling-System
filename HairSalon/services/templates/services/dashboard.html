<!DOCTYPE html>
<html>
<body>
    <h1>欢迎来到 {{ salon.name }} 后台</h1>
    <p>地点：{{ salon.location }}</p>

    <h2>我的团队</h2>
    <ul>
        {% for staff in staffs %}
            <li>{{ staff.name }} - {{ staff.specialty }}</li>
        {% endfor %}
    </ul>

    <h2>我的服务</h2>
    <ul>
        {% for service in services %}
            <li>{{ service.name }} ({{ service.price_range }}) - {{ service.duration }}分钟</li>
        {% endfor %}
    </ul>
</body>
</html>
