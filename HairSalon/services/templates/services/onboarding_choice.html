{% extends 'services/base.html' %}

{% block header_content %}
    <h1 class="display-5 fw-bold">最后一步，{{ request.user.username }}！</h1>
    <p class="lead">请告诉我们您的主要用途，以便我们为您配置界面</p>
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-10">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card h-100 shadow border-0 text-center p-4 choice-card">
                    <div class="card-body d-flex flex-column">
                        <div class="icon-box mb-4 mx-auto bg-light-primary">
                            <i class="bi bi-person-heart display-3 text-primary"></i>
                        </div>
                        <h3 class="fw-bold">我是客户</h3>
                        <p class="text-muted flex-grow-1">我想寻找附近的沙龙、诊所或修车厂，并享受 AI 智能预约带来的便捷体验。</p>
                        <a href="{% url 'salon_list' %}" class="btn btn-outline-primary btn-lg rounded-pill mt-3">
                            开始探索 <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card h-100 shadow border-0 text-center p-4 choice-card featured">
                    <div class="card-body d-flex flex-column">
                        <div class="icon-box mb-4 mx-auto bg-light-purple">
                            <i class="bi bi-shop display-3 text-white"></i>
                        </div>
                        <h3 class="fw-bold">我是店主</h3>
                        <p class="text-muted flex-grow-1">我想管理我的生意、配置员工表，并利用 AI 流量预测来优化我的经营效率。</p>
                        <a href="{% url 'create_salon' %}" class="btn btn-primary btn-lg rounded-pill mt-3">
                            注册我的店铺 <i class="bi bi-rocket-takeoff"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .choice-card {
        border-radius: 25px;
        transition: all 0.3s ease;
        cursor: pointer;
    }
    .choice-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.1) !important;
    }
    .featured {
        background: linear-gradient(135deg, #ffffff 0%, #f9f8ff 100%);
        border: 2px solid #667eea !important;
    }
    .icon-box {
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
    }
    .bg-light-primary { background-color: #eef2ff; }
    .bg-light-purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .rounded-pill { padding-left: 30px; padding-right: 30px; }
</style>
{% endblock %}
