<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SaaS 管理系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .main-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 3rem 0; margin-bottom: 2rem; border-radius: 0 0 25px 25px; }
        .card { border: none; border-radius: 15px; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        /* 1. 让团队标题变成深蓝色 */
        .text-theme-primary { 
            color: #4e54c8 !important; 
            font-weight: bold;
        } 

        /* 2. 让服务项目标题变成紫色 */
        .text-theme-accent { 
            color: #6f42c1 !important; 
            font-weight: bold;
        } 

        /* 3. 让价格 (RM) 变成醒目的蓝色 */
        .table-price { 
            color: #0d6efd !important; 
            font-weight: 800; /* 加粗 */
            font-size: 1.1rem;
        }

        /* 4. 让“在职”标签带点淡蓝色背景，看起来更精致 */
        .badge-ai-status { 
            background-color: #e7f0ff; 
            color: #0d6efd; 
            border: 1px solid #cfe2ff;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="main-header shadow">
        <div class="container text-center">
            {% block header_content %}
                {% endblock %}
        </div>
    </div>

    <div class="container mb-5">
        {% block content %}
            {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
